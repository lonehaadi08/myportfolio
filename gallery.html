<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haadi Sabzar Lone - Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            color: #fff;
            padding-bottom: 2rem;
        }

        nav {
            background: rgba(0,0,0,0.85);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            color: #f0f0f0;
            font-weight: 600;
            font-size: 1.1rem;
            transition: color 0.3s, transform 0.3s;
        }

        nav a:hover {
            color: #ff6ec7;
            transform: scale(1.1);
        }

        .gallery-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .gallery-header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: #ff6ec7;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }

        .gallery-header p {
            font-size: 1.2rem;
            color: #ccc;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            cursor: pointer;
            transform: scale(0.9);
            transition: transform 0.5s, box-shadow 0.5s;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s;
        }

        .gallery-item:hover {
            transform: scale(1);
            box-shadow: 0 10px 25px rgba(255,110,199,0.5);
        }

        .gallery-item:hover img {
            transform: scale(1.1) rotate(2deg);
        }

        /* Overlay */
        .overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            color: #fff;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .gallery-header h1 { font-size: 2rem; }
            .gallery-header p { font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        }

    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Photo Gallery</a></li>
        </ul>
    </nav>

    <!-- Gallery Section -->
    <div class="gallery-container">
        <div class="gallery-header">
            <h1>Photo Gallery</h1>
            <p>Explore my photography and creative work</p>
        </div>

        <div class="gallery-grid">
            <!-- Example Image Items - Replace src with your own images -->
            <div class="gallery-item">
                <img src="images/photo1.jpg" alt="Photo 1">
                <div class="overlay">Photo 1 Description</div>
            </div>
            <div class="gallery-item">
                <img src="images/photo2.jpg" alt="Photo 2">
                <div class="overlay">Photo 2 Description</div>
            </div>
            <div class="gallery-item">
                <img src="images/photo3.jpg" alt="Photo 3">
                <div class="overlay">Photo 3 Description</div>
            </div>
            <div class="gallery-item">
                <img src="images/photo4.jpg" alt="Photo 4">
                <div class="overlay">Photo 4 Description</div>
            </div>
            <div class="gallery-item">
                <img src="images/photo5.jpg" alt="Photo 5">
                <div class="overlay">Photo 5 Description</div>
            </div>
            <div class="gallery-item">
                <img src="images/photo6.jpg" alt="Photo 6">
                <div class="overlay">Photo 6 Description</div>
            </div>
        </div>
    </div>

</body>
</html>
